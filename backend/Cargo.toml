[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["rand_core"] }
axum = "0.8.9"
dotenv = "0.15.0"
hyper = "1.9.0"
rand_core = "0.10.1"
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "uuid"] }
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.52.2", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
serde_json = "1.0.154"
utoipa = { version = "6.0.0", features = ["axum_extras", "time", "uuid"] }
